bundle:
  name: agentops-lakehouse

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405608962971070.10.azuredatabricks.net

resources:
  jobs:
    agentops_daily_pipeline:
      name: agentops_daily_pipeline
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"
        timezone_id: America/Chicago
        pause_status: PAUSED
      job_clusters:
        - job_cluster_key: single_node
          new_cluster:
            spark_version: "18.x-scala2.13"
            node_type_id: Standard_D4ds_v4
            num_workers: 0
            data_security_mode: USER_ISOLATION
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode
      tasks:
        - task_key: bronze_ingest
          job_cluster_key: single_node
          max_retries: 1
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ./databricks/notebooks/01_bronze_ingest.ipynb
        - task_key: silver_traces
          depends_on:
            - task_key: bronze_ingest
          job_cluster_key: single_node
          max_retries: 1
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ./databricks/notebooks/02_silver_traces.ipynb
        - task_key: gold_metrics
          depends_on:
            - task_key: silver_traces
          job_cluster_key: single_node
          max_retries: 1
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ./databricks/notebooks/03_gold_metrics.ipynb